<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hold for Sound</title>
<!-- Shown by access.js in place of the page until the password is given. Whatever this file loads
     must be on the OPEN list there, or it is refused too. -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- The page may be hosted under a path, and its links are relative, so the address must end in a slash. -->
<script>if (!location.pathname.endsWith('/')) location.replace(location.pathname + '/' + location.search + location.hash);</script>
<link rel="stylesheet" href="theme.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; padding: 0 var(--gap) 2rem; background: var(--bg); color: var(--ink); font: 500 var(--text-m) / 1.4 var(--font); -webkit-text-size-adjust: 100%; }
main { max-width: 22rem; margin: 18vh auto 0; }
h1, p { margin: 0; }
h1 { font-size: var(--text-l); font-weight: 800; }
form { display: grid; gap: 0.5rem; margin-block: 1rem; padding: 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
label { font-weight: 700; }
input { width: 100%; min-height: 2.75rem; padding: 0 0.75rem; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--ink-2); border-radius: var(--radius); }
button { min-height: 2.75rem; margin-top: 0.5rem; padding: 0 1rem; font: inherit; font-weight: 700; color: var(--bg); background: var(--ink); border: 0; border-radius: var(--radius); cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#wrong { font-weight: 700; color: var(--hold); }
</style>
</head>
<body>
<main>
  <h1>Hold for Sound</h1>
  <form method="post">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autofocus autocomplete="current-password" autocapitalize="none" enterkeyhint="go" aria-describedby="wrong">
    <p id="wrong">Wrong password.</p>
    <button>Open</button>
  </form>
</main>
</body>
</html>
